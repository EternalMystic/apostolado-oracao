[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#5B21B6"
backgroundColor = "#F4F1FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[runner]
fastReruns = true
