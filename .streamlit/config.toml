[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#B388FF"
backgroundColor = "#3E1078"
secondaryBackgroundColor = "#6A1B9A"
textColor = "#FFFFFF"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[runner]
fastReruns = true
