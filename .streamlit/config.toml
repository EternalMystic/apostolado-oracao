[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[theme]
primaryColor = "#6A1B9A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3E5F5"
textColor = "#1A1A1A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[runner]
fastReruns = true
